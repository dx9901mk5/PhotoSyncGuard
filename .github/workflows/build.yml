name: Build and Release Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build Release APK
        run: gradle assembleRelease
      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk PhotoSyncGuard-v1.0.8.apk
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSyncGuard-APK
          path: PhotoSyncGuard-v1.0.8.apk
      - name: Publish GitHub Release v1.0.8
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.8 >/dev/null 2>&1; then
            gh release upload v1.0.8 PhotoSyncGuard-v1.0.8.apk --clobber
          else
            gh release create v1.0.8 PhotoSyncGuard-v1.0.8.apk \
              --title "PhotoSyncGuard v1.0.8" \
              --notes "改為「先強制等待至少 30 秒以上、再執行全數算圖驗證」兩階段機制：只要拍照或寫入照片即無條件鎖定斷網，在等待期滿前絕不提前判定或放行網路，待期滿且全數照片通過驗證後才開放 Google 相簿上傳。"
          fi
