name: Build and Release Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build Release APK
        run: gradle assembleRelease
      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk PhotoSyncGuard-v1.0.1.apk
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSyncGuard-APK
          path: PhotoSyncGuard-v1.0.1.apk
      - name: Publish GitHub Release v1.0.1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.1 >/dev/null 2>&1; then
            gh release upload v1.0.1 PhotoSyncGuard-v1.0.1.apk --clobber
          else
            gh release create v1.0.1 PhotoSyncGuard-v1.0.1.apk \
              --title "PhotoSyncGuard v1.0.1" \
              --notes "Material Design 3 動態主題、頂部緊急防呆按鈕、可開關狀態通知、24 小時自動清除紀錄、固定簽名與整合圖示。 (Note: vivo Global OriginOS 7 / Android 17 already has a built-in fix.)"
          fi
