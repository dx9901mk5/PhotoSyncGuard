name: Build and Release Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build Release APK
        run: gradle assembleRelease
      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk PhotoSyncGuard-v1.0.6.apk
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSyncGuard-APK
          path: PhotoSyncGuard-v1.0.6.apk
      - name: Publish GitHub Release v1.0.6
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.6 >/dev/null 2>&1; then
            gh release upload v1.0.6 PhotoSyncGuard-v1.0.6.apk --clobber
          else
            gh release create v1.0.6 PhotoSyncGuard-v1.0.6.apk \
              --title "PhotoSyncGuard v1.0.6" \
              --notes "新增英文（English）與簡體中文（简体中文）介面支援，隨系統語言自動切換；並於 GitHub README 補上實機截圖與免 Root / 必須使用 Shizuku 說明。"
          fi
