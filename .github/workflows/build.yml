name: Build and Release Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build Release APK
        run: gradle assembleRelease
      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk PhotoSyncGuard-v1.0.4.apk
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSyncGuard-APK
          path: PhotoSyncGuard-v1.0.4.apk
      - name: Publish GitHub Release v1.0.4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.4 >/dev/null 2>&1; then
            gh release upload v1.0.4 PhotoSyncGuard-v1.0.4.apk --clobber
          else
            gh release create v1.0.4 PhotoSyncGuard-v1.0.4.apk \
              --title "PhotoSyncGuard v1.0.4" \
              --notes "修復暫存檔尚未清除前就提早恢復 Google 相簿網路的問題：1) 暫存檔 (.pending/.tmp) 強制鎖定阻斷 2) 恢復網路前全目錄掃描確認無近期暫存檔與 < 1MB 照片 3) 補齊 OPPO/小米相機套件名稱。"
          fi
